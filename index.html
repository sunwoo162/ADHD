<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playground</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <div id="app">
      <header class="topbar" aria-label="상단 메뉴">
        <button class="icon-button" id="homeBtn" type="button" aria-label="홈으로">⌂</button>
        <div>
          <p class="eyebrow">ASMR tactile playground</p>
          <h1>Playground</h1>
        </div>
        <div class="top-actions">
          <button class="ghost-button sound-on" id="soundBtn" type="button" aria-pressed="true">ASMR 소리 켜짐</button>
          <button class="ghost-button" id="resetBtn" type="button">초기화</button>
        </div>
      </header>

      <main>
        <section class="home" id="homeView">
          <div class="hero">
            <p class="badge">클릭 · 팝 · 딸깍 ASMR</p>
            <h2>만지면 바로 반응하는 오브젝트</h2>
            <p>키보드, 팝잇볼, 스위치, 뽁뽁이처럼 실제 손맛이 떠오르는 체험만 남겼습니다. 소리는 기본으로 켜져 있고 첫 클릭이나 터치부터 재생됩니다.</p>
          </div>

          <div class="room-grid" id="roomGrid" aria-label="놀이방 목록"></div>
        </section>

        <section class="playroom hidden" id="playView" aria-label="놀이방">
          <div class="room-panel">
            <div>
              <p class="eyebrow" id="roomKicker">Bubble World</p>
              <h2 id="roomTitle">Bubble World</h2>
              <p id="roomHint">눌러서 터뜨려 보세요.</p>
            </div>
            <div class="room-stats">
              <span id="counter">0</span>
              <span id="modeLabel">pop</span>
            </div>
          </div>
          <canvas id="stage" aria-label="인터랙티브 캔버스"></canvas>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
